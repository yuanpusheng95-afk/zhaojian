services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photo_agent
      POSTGRES_USER: photo_agent
      POSTGRES_PASSWORD: photo_agent
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_agent -d photo_agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - photo_agent_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: photoagent
      MINIO_ROOT_PASSWORD: photoagent123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - photo_agent_minio:/data

volumes:
  photo_agent_postgres:
  photo_agent_minio:
